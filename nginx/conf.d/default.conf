# PHASE 1 (bootstrap) — plain HTTP only. Used to obtain the first TLS
# certificate. Replace this file's contents with default.conf.https-template
# once that's done — see ../README.md for the exact steps.
server {
    listen 80;
    listen [::]:80;
    server_name api.yamin.yourdomain.com;

    # Lets certbot prove domain ownership to Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://backend-api:3000;
        proxy_http_version 1.1;
        # Required for socket.io/WebSocket connections — without these two
        # headers, nginx proxies plain HTTP fine but silently breaks the
        # WebSocket upgrade handshake, so real-time features would fail even
        # though every normal REST request works.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
