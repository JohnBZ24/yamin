# Every service gets bounded json-file logging; without this, container logs
# grow until the EC2 root volume fills and the whole box falls over.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# One image, built once, shared by migrate/api/worker. Declaring the same
# build block on all three used to produce three separate builds — on a small
# EC2 instance that tripled the chance of an OOM during `up --build`.
x-backend-image: &backend-image
  image: yamin-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  # --- PostgreSQL Database Engine (with pgvector support) ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yamin_postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      # Loopback-bound: reachable from this host (local `npm run dev`) but not
      # from the network. A bare '5433:5432' binds 0.0.0.0.
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redis Server (BullMQ Queue Hub + socket.io adapter backbone) ---
  redis:
    image: redis:7-alpine
    container_name: yamin_redis
    restart: always
    logging: *default-logging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      # Loopback-bound. Redis holds queued voice notes and realtime traffic;
      # the previous '6379:6379' bound 0.0.0.0, exposing it to the whole
      # network behind one weak password. Keeping it on 127.0.0.1 still lets a
      # local `npm run dev` connect, which the containers don't need but you do.
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # --- One-shot schema migration ---
  # Runs to completion before either app instance starts.
  migrate:
    <<: *backend-image
    container_name: yamin_migrate
    restart: 'no'
    logging: *default-logging
    command: ['npm', 'run', 'migration:run:prod']
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  # --- Backend HTTP & WebSockets API Instance (producer) ---
  backend-api:
    <<: *backend-image
    container_name: yamin_backend_api
    restart: always
    logging: *default-logging
    command: ['node', 'dist/main']
    env_file:
      - .env
    environment:
      # NODE_ENV is pinned here, not trusted from .env — a dev .env copied to
      # the server must not silently disable production CORS enforcement or
      # start leaking error details.
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
    ports:
      # Loopback-bound, same reasoning as postgres/redis above: reachable from
      # this host for debugging, but not from the internet. nginx (below) is
      # the only service with a publicly published port, and reaches this one
      # over the internal compose network regardless of this mapping.
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3000/api/v1/health/ready'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- Backend Background Worker Instance (consumer) ---
  # Separate entrypoint, not a RUN_MODE env branch. Scale with:
  #   docker compose up --scale backend-worker=3
  backend-worker:
    <<: *backend-image
    # No container_name — Docker refuses to scale a service that pins one.
    restart: always
    logging: *default-logging
    command: ['node', 'dist/main.worker']
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker touches /tmp/worker-heartbeat on an interval (see
      # main.worker.ts). A worker that boots, connects, and then silently hangs
      # used to look healthy forever — this catches it.
      test: ['CMD-SHELL', 'test $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat 2>/dev/null || echo 0) )) -lt 60']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Reverse proxy: the ONLY service exposed to the internet ---
  # Serves the frontend at / and the API at /api + /socket.io, all on one
  # origin (which also makes browser CORS a non-issue). Config in
  # ./nginx/conf.d is rendered on the server by ./nginx/setup.sh and is
  # gitignored, so a `git pull` can never revert HTTPS back to HTTP again.
  nginx:
    image: nginx:1.27-alpine
    container_name: yamin_nginx
    restart: always
    logging: *default-logging
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      backend-api:
        condition: service_healthy
      frontend:
        condition: service_started

  # --- Certbot: obtains and renews the free Let's Encrypt certificate ---
  # Runs `certbot renew` on a loop every 12h; renew is a no-op until the cert
  # is within 30 days of expiring, so this is safe to leave running forever.
  # The FIRST certificate is requested by ./nginx/setup.sh — see nginx/README.md.
  certbot:
    image: certbot/certbot
    container_name: yamin_certbot
    restart: always
    logging: *default-logging
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

  # --- Frontend React Native (Expo Web) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time (see frontend/Dockerfile). MUST be
        # set in production to the public origin nginx answers on — e.g.
        # http://54.243.125.69 or https://your-domain. Leaving it empty does NOT
        # produce same-origin requests: api.ts falls back to a localhost default,
        # so an empty value ships a bundle that points every visitor's browser at
        # their OWN machine. Port 80/443 (nginx), never :3000 — the API is
        # loopback-bound.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
    container_name: yamin_frontend
    restart: always
    logging: *default-logging
    ports:
      # Loopback-bound: the public path to the frontend is through nginx.
      # This was the one service accidentally published on 0.0.0.0 with no TLS.
      - '127.0.0.1:8080:8080'

volumes:
  pgdata:
  redisdata:
