name: Deploy

# Every push to main deploys automatically once CI is green; the
# workflow_dispatch trigger is the "deploy now" button for reruns.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys interleave on the box; a queued one waits.
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          # Optional: leave DOMAIN unset to serve plain HTTP on the instance IP.
          DOMAIN: ${{ secrets.DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            DOMAIN="$DOMAIN" CERTBOT_EMAIL="$CERTBOT_EMAIL" APP_DIR="${APP_DIR:-\$HOME/app}" 'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$APP_DIR"

          echo "==> Updating source"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Rendering nginx config (idempotent; keeps HTTPS if enabled)"
          chmod +x nginx/setup.sh
          # </dev/null on every docker invocation below: this whole script is fed
          # to `bash -s` over STDIN, so any command that reads STDIN eats the
          # remaining lines. That failure is silent AND exits 0 — a deploy that
          # reports success having built nothing.
          ./nginx/setup.sh "$DOMAIN" </dev/null

          echo "==> Building and starting services"
          docker compose pull postgres redis nginx certbot </dev/null
          # Serially, and not `up --build`: this box is a t3.micro with 1 GB of
          # RAM, and two Node toolchains building at once thrash swap.
          docker compose build backend-api </dev/null
          docker compose build frontend </dev/null
          docker compose up -d --remove-orphans </dev/null

          echo "==> Waiting for API readiness"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health/ready >/dev/null 2>&1; then
              echo "API is ready."
              break
            fi
            [ "$i" = 30 ] && { echo "API never became ready"; docker compose ps; docker compose logs --tail 100 backend-api; exit 1; }
            sleep 5
          done

          echo "==> Verifying the PUBLIC path, through nginx"
          # The check above talks to 127.0.0.1:3000 — the container's published
          # loopback port. That proves the API booted; it proves nothing about
          # whether anyone on the internet can reach it, because it never
          # touches nginx.
          #
          # That gap shipped a fully broken production once already: `up -d`
          # recreated backend-api on a new container IP, nginx went on dialling
          # the old one, and every /api request returned 502 — while this step
          # went green and the deploy reported success. Both containers were
          # healthy. Only the wire between them was dead, and nothing looked at
          # the wire.
          #
          # Read the domain from the file setup.sh persists, not from $DOMAIN:
          # the secret may be unset, and an empty domain here would silently
          # test plain HTTP and accept the 301 to HTTPS as a pass.
          EFFECTIVE_DOMAIN="$(cat nginx/conf.d/.domain 2>/dev/null || true)"
          if [ -n "$EFFECTIVE_DOMAIN" ]; then
            HEALTH_ARGS="--resolve $EFFECTIVE_DOMAIN:443:127.0.0.1 https://$EFFECTIVE_DOMAIN/api/v1/health/ready"
          else
            HEALTH_ARGS="http://127.0.0.1/api/v1/health/ready"
          fi
          for i in $(seq 1 12); do
            # Assert 200 explicitly. `curl -f` treats a 301 as success, which is
            # exactly what the HTTP-only branch would get back.
            code="$(curl -sS -o /dev/null -w '%{http_code}' $HEALTH_ARGS 2>/dev/null || echo 000)"
            if [ "$code" = 200 ]; then
              echo "Public API path OK (nginx -> backend-api)."
              break
            fi
            [ "$i" = 12 ] && {
              echo "nginx cannot reach the API (last status: $code) — the site is down for real users."
              docker compose logs --tail 50 nginx
              exit 1
            }
            sleep 5
          done

          echo "==> Verifying audio storage is configured"
          # Voice notes are the product. Without AWS credentials the API still
          # boots, still passes every check above, and still answers 200 — and
          # then hands every phone an unusable upload URL. That shipped once and
          # took a debugging session to find, because nothing on the server said
          # anything was wrong. Now the deploy says it.
          if ! curl -fsS http://127.0.0.1:3000/api/v1/health/ready \
               | grep -q '"storage":{"status":"up"}'; then
            echo "S3 is not configured — voice notes would fail to store audio."
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in $APP_DIR/.env, then redeploy."
            exit 1
          fi
          echo "Audio storage OK."

          echo "==> Pruning old images"
          docker image prune -f

          docker compose ps
          DEPLOY

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
